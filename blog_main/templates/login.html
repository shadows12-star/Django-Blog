{% extends 'base.html' %}

{% block content %}
{% load crispy_forms_tags %}
<form action="{% url 'login' %}" method="POST" style="max-width: 500px; margin: 0 auto;">
    {% csrf_token%}
    {{form|crispy}}
    <button type="submit" class="btn btn-warning" style="width: 100%;border-radius: 15px;">Login</button>
</form>

{% endblock %}
