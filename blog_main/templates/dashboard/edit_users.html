{% extends 'base.html' %}

{% block content %}
{% if perms.auth.view_user %}

{% load crispy_forms_tags %}

<H2>Edit User</H2>
<form method="POST" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form|crispy }}
    <button type="submit" class="btn btn-sm btn-warning">Update User </button>
    <br>
</form>
{% else %}
<h2>You don't have permission to view this page</h2>
{% endif %}
{% endblock content %}
